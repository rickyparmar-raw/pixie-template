name: test

# Every bot in the fleet deploys from this branch, so main is production for
# every YSWS program at once. A red suite must not be able to land here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant — cancel it rather than paying
# for both and reporting the stale one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Pinned to the version in package.json's packageManager field. The suite
      # needs Bun specifically, not Node: lib/db.js imports `bun:sqlite`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # No secrets needed: lib/test-setup.js pins PIXIE_DB_PATH to :memory: and
      # model calls are stubbed. One caveat — lib/link.test.js resolves real
      # hostnames through DNS to test the SSRF guard, so this job needs outbound
      # DNS (it has it on hosted runners; it fails on an offline machine).
      - run: bun test
